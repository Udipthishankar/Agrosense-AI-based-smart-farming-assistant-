<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AgroSense - Crop AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">🌿 AgroSense</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="crops.html" class="active">Crop AI</a>
            <a href="disease.html">Disease Detection</a>
            <a href="weather.html">Weather</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <div class="container">
        <h2 class="page-title">Smart Crop Recommendation</h2>
        
        <form id="cropForm" class="form-grid">
            <div class="form-group"><label>Nitrogen (N):</label><input type="number" id="nitrogen" required></div>
            <div class="form-group"><label>Phosphorus (P):</label><input type="number" id="phosphorus" required></div>
            <div class="form-group"><label>Potassium (K):</label><input type="number" id="potassium" required></div>
            <div class="form-group"><label>Temperature (°C):</label><input type="number" step="any" id="temperature" required></div>
            <div class="form-group"><label>Humidity (%):</label><input type="number" step="any" id="humidity" required></div>
            <div class="form-group"><label>Soil pH:</label><input type="number" step="any" id="ph" required></div>
            <div class="form-group"><label>Rainfall (mm):</label><input type="number" step="any" id="rainfall" required></div>
            
            <button type="submit" id="submitBtn" class="btn">Get Crop Recommendation</button>
        </form>

        <div id="resultCard" class="result-card">
            <h3>🌾 Recommended Crop:</h3>
            <p id="recommendedCrop" style="font-size: 1.5rem; font-weight: bold; color: #1b5e20; text-transform: capitalize;"></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 AgroSense. Empowering modern agriculture.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
